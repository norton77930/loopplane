name: desktop

# The isolated gate for the desktop app. It also runs on apps/web changes because
# the desktop renderer imports current web source through @web/*.
on:
  push:
    paths:
      - "apps/desktop/**"
      - "apps/web/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/web/**"
      - ".github/workflows/desktop.yml"

jobs:
  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
