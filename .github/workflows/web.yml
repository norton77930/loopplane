name: web

# The isolated JS gate for the web frontend (unit 018). It runs only on changes to
# apps/web and does not touch the Python CI gate.
on:
  push:
    paths:
      - "apps/web/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web.yml"

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck -w @loopplane/web
      - run: npm test -w @loopplane/web
      - run: npm run build -w @loopplane/web
