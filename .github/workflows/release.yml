name: Release

# Tag-triggered release automation (unit 082).
#
# Only a `v*` tag push can reach the publish step. `workflow_dispatch` exists so
# the pipeline can be exercised safely: a dispatch run is never a tag push, so
# the publish job's condition can never be satisfied from it.
#
# Publishing stays OFF until the maintainer both (a) configures the PyPI trusted
# publisher for this repository and (b) sets the repository variable
# `LOOPPLANE_RELEASE_DRY_RUN` to `false`. Anything else - unset, empty, `true` -
# means dry run: build and validate, publish nothing, create no release.
#
# Runbook: docs/release-process.md

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag to validate (dry run only; never publishes)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate release sync and gates
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.commit.outputs.sha }}
      dry-run: ${{ steps.mode.outputs.dry-run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Record checked-out commit
        id: commit
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Resolve the release tag
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            tag="$REF_NAME"
          else
            tag="$INPUT_TAG"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Resolve the dry-run mode
        id: mode
        env:
          DRY_RUN_VARIABLE: ${{ vars.LOOPPLANE_RELEASE_DRY_RUN }}
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          if [ "$DRY_RUN_VARIABLE" = "false" ] && [ "$EVENT_NAME" = "push" ]; then
            dry_run=false
          else
            dry_run=true
          fi
          echo "dry-run=$dry_run" >> "$GITHUB_OUTPUT"
          {
            echo "## Release mode"
            echo ""
            echo "- Tag: \`$TAG\`"
            echo "- Trigger: \`$EVENT_NAME\`"
            echo "- Repository variable \`LOOPPLANE_RELEASE_DRY_RUN\`: \`${DRY_RUN_VARIABLE:-<unset>}\`"
            echo "- **Dry run: \`$dry_run\`**"
            if [ "$dry_run" = "true" ]; then
              echo "- Publish and GitHub Release steps will be **skipped**."
            else
              echo "- Publish will run via PyPI trusted publishing."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: uv sync --locked

      - name: Release-sync check (fail closed)
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          uv run python scripts/release_sync_check.py "$TAG" \
            --notes-file release-notes.md

      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests
        run: uv run pytest -q

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  build:
    name: Build and validate distributions
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Build distribution
        run: uv build
      - name: Validate distribution metadata
        run: uvx twine check --strict dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI (trusted publishing)
    needs: [validate, build]
    # Structurally unreachable unless this is a v* tag push on the canonical
    # repository with dry run explicitly turned off. A workflow_dispatch run is
    # never a push, so it can never satisfy this condition.
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      github.repository == 'norton77930/loopplane' &&
      needs.validate.outputs.dry-run == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for trusted publishing; no long-lived token exists
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Re-running the workflow for the same tag after a partial failure
          # must not fail on files that already landed on the index.
          skip-existing: true
      - name: Record the publish in the run summary
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          {
            echo "## Publish"
            echo ""
            echo "- Published \`$TAG\` to PyPI via trusted publishing"
            echo "  (\`skip-existing\` keeps re-runs idempotent)."
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Create the GitHub Release
    needs: [validate, build, publish]
    # Skipped automatically whenever `publish` is skipped (dry run) or fails,
    # so a dry run creates no release and a failed publish creates no release.
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      github.repository == 'norton77930/loopplane'
    runs-on: ubuntu-latest
    permissions:
      contents: write # creating the release is the only write this workflow needs
    steps:
      - uses: actions/checkout@v4
      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --title "$TAG" --notes-file release-notes.md
          fi
