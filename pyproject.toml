[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loopplane"
version = "0.1.0"
description = "Embeddable agent harness runtime: agent loop, tool gateway, normalized events, checkpointing."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4",
    "pydantic>=2",
    "jsonschema>=4",
]

[project.optional-dependencies]
mcp = ["mcp>=1"]
otel = ["opentelemetry-api>=1"]
web = ["fastapi>=0.111"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "mypy>=1.13",
    "mcp>=1",
    "opentelemetry-sdk>=1",
    "fastapi>=0.111",
    "httpx>=0.27",
]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src"]
mypy_path = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
