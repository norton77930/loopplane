[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loopplane"
description = "Embeddable agent harness runtime: agent loop, tool gateway, normalized events, checkpointing."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dynamic = ["version"]
authors = [{ name = "LoopPlane contributors" }]
keywords = [
    "agent",
    "agent-runtime",
    "agent-loop",
    "tool-gateway",
    "llm",
    "loop-engineering",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "anyio>=4",
    "pydantic>=2",
    "jsonschema>=4",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
mcp = ["mcp>=1"]
openai = ["openai>=1.50"]
otel = ["opentelemetry-api>=1"]
web = ["fastapi>=0.111"]

[project.scripts]
loopplane = "loopplane.cli:main"

[project.urls]
Homepage = "https://github.com/norton77930/loopplane"
Repository = "https://github.com/norton77930/loopplane"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "mypy>=1.13",
    "anthropic>=0.40",
    "mcp>=1",
    "openai>=1.50",
    "opentelemetry-sdk>=1",
    "fastapi>=0.111",
    "httpx>=0.27",
    "pytest-timeout>=2.3",
]

[tool.hatch.version]
path = "src/loopplane/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/loopplane"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src"]
mypy_path = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# A generous per-test timeout (thread method = cross-platform) so a stuck test
# fails fast instead of hanging the suite / CI.
addopts = "--timeout=60 --timeout-method=thread --basetemp=tmp/pytest"
